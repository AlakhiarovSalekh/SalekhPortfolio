name: Real Portrait Verify

on:
  push:
    branches:
      - fix/real-portrait-route-20260918
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
